version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm install --legacy-peer-deps
    build:
      commands:
        # Amplify Hosting only exposes Console/API-configured environment
        # variables to the build shell, not to the deployed SSR compute's
        # runtime process. Next.js auto-loads .env.production at server
        # startup, so persisting these here is what actually makes them
        # reachable via process.env at request time.
        - env | grep -E '^(DATABASE_|S3_EVENT_PHOTOS_BUCKET=)' > .env.production
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - '.next/cache/**/*'
backend:
  phases:
    build:
      commands:
        - echo "Backend is deployed via Amplify Gen 2"
env:
  variables:
    NEXT_PUBLIC_AWS_REGION: us-east-1
    NEXT_PUBLIC_APPSYNC_REGION: us-east-1
    NEXT_PUBLIC_APPSYNC_AUTHENTICATION_TYPE: AMAZON_COGNITO_USER_POOLS
